name: CI/CD Pipeline - Core Auth

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # ── Stage 1: Linter ──────────────────────────────────────────────────
      - name: Run Linter (Ruff)
        run: ruff check .

      # ── Stage 2: Static Security Audit (SAST) ───────────────────────────
      - name: Run Security Scan (Bandit)
        run: bandit -r app/ -ll

      # ── Stage 3: Async Test Suite ────────────────────────────────────────
      - name: Run Tests
        env:
          PG_USER: postgres
          PG_PASS: postgres
          PG_HOST: localhost
          PG_NAME: auth_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short