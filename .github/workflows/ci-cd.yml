name: CI/CD Pipeline - Core Auth

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Dependencies
        run: uv pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: |
          uv pip install ruff
          ruff check .

      - name: Run Tests
        env:
          PG_USER: postgres
          PG_PASS: postgres
          PG_HOST: localhost
          PG_NAME: auth_db
        run: |
          # Agar tests banaaye ho to yahan chalao
          echo "✅ Tests passed (Add proper tests later)"